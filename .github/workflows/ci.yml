name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # deploy.yml reuses this as its test gate

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  slo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: promtool check + unit tests
        run: |
          docker run --rm -v "$PWD/observability/slo:/slo" -w /slo --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules rules.yaml
          docker run --rm -v "$PWD/observability/slo:/slo" -w /slo --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules rules_test.yaml

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cmd: [control-plane, services/hello]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg CMD=${{ matrix.cmd }} .
