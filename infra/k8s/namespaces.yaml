apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-system
---
# A team namespace developers deploy into through the control-plane.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
# The guardrail reads this (limits.cpu / limits.memory) before accepting a deployment,
# and Kubernetes enforces it too, so the policy holds even if someone bypasses the API.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sentinel-quota
  namespace: team-a
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 2Gi
    requests.cpu: "2"
    requests.memory: 2Gi
