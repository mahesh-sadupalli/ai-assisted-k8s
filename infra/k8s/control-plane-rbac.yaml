apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: sentinel-system
---
# Least privilege: manage Deployments/Services and read quotas. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-control-plane
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: sentinel-system
