# kube-prometheus-stack, trimmed for a laptop kind cluster.
# M5: only SLO alerts go to the Sentinel agent; everything else is dropped on kind.
alertmanager:
  enabled: true
  config:
    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - matchers: ['slo=~".+"']
          receiver: sentinel-agent
    receivers:
      - name: "null"
      - name: sentinel-agent
        webhook_configs:
          - url: http://sentinel-agent.sentinel-system/alerts
            send_resolved: true
prometheus:
  prometheusSpec:
    # pick up every ServiceMonitor/PrometheusRule, not just ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
grafana:
  adminPassword: sentinel
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring:3100
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
