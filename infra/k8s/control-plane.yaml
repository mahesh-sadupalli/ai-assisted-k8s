apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane
  namespace: sentinel-system
data:
  ALLOWED_REGISTRIES: ghcr.io/mahesh-sadupalli/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sentinel-system
  labels: {app: control-plane}
spec:
  replicas: 1
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane}
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: ghcr.io/mahesh-sadupalli/control-plane:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: control-plane}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sentinel-system
  labels: {app: control-plane}
spec:
  selector: {app: control-plane}
  ports:
    - {name: http, port: 80, targetPort: http}
